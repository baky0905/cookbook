title: Fridge and freezer
intro: "Fridge at 4 °C or colder, freezer at −18 °C. Fridge times are for safety; freezer times are for quality (frozen food stays safe indefinitely). Don't leave perishables out for more than 2 hours."
sources:
  - { title: "FoodSafety.gov (USDA) — Cold food storage chart", url: "https://www.foodsafety.gov/food-safety-charts/cold-food-storage-charts" }
