title: Fridge and freezer
sources:
  - { title: "Mattilsynet — Råd for oppbevaring av mat og drikke", url: "https://mattilsynet.no/mat-og-drikke/forbrukere/rad-for-oppbevaring-av-mat" }
  - { title: "FoodSafety.gov (USDA) — Cold food storage chart (times per food)", url: "https://www.foodsafety.gov/food-safety-charts/cold-food-storage-charts" }
rules:
  - { icon: "🧊", title: "Fridge: −1 to 4 °C", text: "Some bacteria double in about half an hour from 5 °C." }
  - { icon: "❄️", title: "Freezer: −18 °C or colder", text: "Frozen food stays safe; quality drops after 3–12 months." }
  - { icon: "🍱", title: "Leftovers: 2–4 days", text: "Cool within 2 hours, store covered, check with your senses." }
  - { icon: "🫗", title: "Thaw in the fridge", text: "Or in cold water in a sealed bag, or in the microwave if cooking straight away. Not on the counter." }
groups:
  - name: Raw meat and fish
    rows:
      - { icon: "🍔", food: "Minced meat and minced poultry", fridge: 1–2 days, freezer: 3–4 months }
      - { icon: "🐔", food: "Chicken and turkey, whole or pieces", fridge: 1–2 days, freezer: 9–12 months }
      - { icon: "🥩", food: "Steaks, chops and roasts", fridge: 3–5 days, freezer: 4–12 months }
      - { icon: "🌭", food: "Fresh sausages", fridge: 1–2 days, freezer: 1–2 months }
      - { icon: "🥓", food: Bacon, fridge: 7 days, freezer: 1 month }
      - { icon: "🐟", food: "Lean fish (cod, pollock)", fridge: 1–2 days, freezer: 6–8 months }
      - { icon: "🐟", food: "Fatty fish (salmon, mackerel)", fridge: 1–2 days, freezer: 2–3 months }
      - { icon: "🦐", food: "Shrimp, squid, scallops", fridge: 1–2 days, freezer: 3–6 months }
  - name: Cooked and ready
    rows:
      - { icon: "🍗", food: "Cooked meat and poultry", fridge: 3–4 days, freezer: 2–4 months }
      - { icon: "🍲", food: "Soups and stews", fridge: 3–4 days, freezer: 2–3 months }
      - { icon: "🐟", food: Cooked fish, fridge: 3–4 days, freezer: 4–6 months }
      - { icon: "🍕", food: Pizza, fridge: 3–4 days, freezer: 1–2 months }
      - { icon: "🥪", food: "Cold cuts and ham, opened", fridge: 3–5 days, freezer: 1–2 months }
      - { icon: "🥗", food: "Egg, chicken, pasta or potato salad", fridge: 3–5 days, freezer: "–" }
  - name: Eggs and dairy
    rows:
      - { icon: "🥚", food: "Eggs, raw in shell", fridge: 3–5 weeks, freezer: "–" }
      - { icon: "🥚", food: "Eggs, hard-boiled", fridge: 1 week, freezer: "–" }
      - { icon: "🫙", food: "Mayonnaise, opened", fridge: 2 months, freezer: "–" }
note: "Fridge times follow Mattilsynet's leftovers guidance and the USDA chart, the most detailed official list per food. “–” means don't freeze."
