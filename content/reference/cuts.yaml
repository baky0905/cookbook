title: Cutting sizes
intro: "Diagrams are drawn to scale (close to actual size on most screens). Add your own photo to any cut in the editor."
sources:
  - { title: "Culinary Institute of America — The Professional Chef (standard knife cuts)" }
cuts:
  - { id: mince, name: Minced, aka: "very finely chopped", size: under 3 mm, shape: dice, mm: 2 }
