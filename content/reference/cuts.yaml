  - { id: small-dice, name: Small dice, aka: "finely diced", size: 6 × 6 × 6 mm, shape: dice, mm: 6 }
  - { id: medium-dice, name: Medium dice, aka: "diced", size: 12 × 12 × 12 mm, shape: dice, mm: 12 }
  - { id: large-dice, name: Large dice, aka: "chunky dice, chunks", size: 20 × 20 × 20 mm, shape: dice, mm: 20 }
  - { id: julienne, name: Julienne, aka: "matchsticks", size: 3 × 3 × 50 mm, shape: stick, mm: 3, length: 50 }
  - { id: batonnet, name: Batonnet, aka: "sticks, batons", size: 6 × 6 × 60 mm, shape: stick, mm: 6, length: 60 }
  - { id: slice, name: Slices, aka: "rounds; thinly sliced is about 2 mm", size: 6 mm thick, shape: slice, mm: 6 }
